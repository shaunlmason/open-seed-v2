# perf-scale (live, deterministic, no model secrets; plans/os-a00d3f34.md).
# The contention benchmark at the target scale (charter III.C row 4):
# the same gate `make check-next` runs at 24 writers, run weekly at the
# scale profile's hundreds of writers against the same representative
# history, with no lost or doubled update asserted. Read-only on
# purpose: a scheduled identity is least-privilege (III.L row 5), and
# the gate writes nothing but its reading, which is attached as an
# artifact whether the gate passed or not. A miss fails the run; the
# red run is the signal, and the next agent reads the artifact.
name: perf-scale

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency: perf-scale

jobs:
  storm:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-env
      - name: 'The gate at the scale profile (next/perf/budgets-scale.json)'
        run: go run ./cmd/perfgate -budgets perf/budgets-scale.json -last perf/last-scale.json -keep "$RUNNER_TEMP/perf-scale-work"
        working-directory: next
      # The admission random walk at the scheduled size
      # (plans/os-21bf939f.md D6): the same walker make check-next runs at
      # 8 walks of 24 steps, at 200 walks of 96. A red run is the signal;
      # the log carries the seed and the step script that reproduce it.
      - name: 'The admission random walk at the scheduled size'
        run: go test ./internal/admit -run TestAdmissionRandomWalk -count=1 -args -walks=200 -steps=96
        working-directory: next
      # The append-loop interleaving check at the scheduled size
      # (plans/os-07e6e76c.md D5): the fast gate's four configurations
      # plus four writers with four attempts, and every terminal trace of
      # the replay configurations driven through real clients. A red run
      # names the trace.
      - name: 'The append-loop interleaving check at the scheduled size'
        run: go test ./internal/gitref -run 'TestAppendInterleavings|TestAppendInterleavingReplay' -count=1 -args -writers=4 -attempts=4 -replay=0
        working-directory: next
      # The reconciliation and racing interleaving checks at the
      # scheduled size (plans/os-873b5153.md D7): the fast gate runs them
      # at depth 4 (852 terminal states, ~1.9s) and race-depth 7 (2,007
      # terminal states, ~2.5s), here at depth 6 (7,068 terminal states,
      # ~20s) and race-depth 9 (22,599 terminal states, ~33s). A red run
      # names the trace that broke the property.
      - name: 'The reconciliation and racing interleaving checks at the scheduled size'
        run: |
          go test ./internal/reconcile -run TestReconciliationInterleavings -count=1 -args -depth=6
          go test ./internal/maintain -run TestRacingInterleavings -count=1 -args -race-depth=9
        working-directory: next
      - name: 'Attach the reading, pass or fail'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-scale-reading
          path: next/perf/last-scale.json
          if-no-files-found: warn
      # A storm that loses a writer writes no reading at all, so the
      # refused trees are the only evidence it leaves: the client keeps
      # each under refused/<commit>/ in its state dir
      # (plans/os-5063e8ba.md D3). Attached on failure alone, since a
      # green run's work dir is large and says nothing.
      - name: 'Attach the refused trees when the storm fails'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-scale-refused
          path: ${{ runner.temp }}/perf-scale-work/**/refused/**
          if-no-files-found: ignore
