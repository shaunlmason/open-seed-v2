# Drafted by seed flywheel from shape s-7cb829a6349b: 2 done contract(s) routed core, accepted by accept.md.
# The run steps are the acceptance spec's own validation commands, verbatim and in order; nothing here was invented.
schema_version: "1"
name: chore-7cb829a6
description: |
  Use when: a contract routed core at tier standard is accepted by accept.md and has recurred.
  NOT for: work whose acceptance is another spec, or a first occurrence.
inputs:
  - {name: goal, type: string, required: true, description: "The intent text of this occurrence"}
  - {name: anchor, type: string, required: true, description: "The acceptance spec's commit for this occurrence"}
defaults: {harness: claude, model: sonnet}
budgets: {max_wall_clock_minutes: 60, max_step_retries: 1}
steps:
  - id: plan
    role: planner
    tools: readonly
    prompt: "Draft a plan for {{inputs.goal}} against the acceptance spec at {{inputs.anchor}}."
    produces: [{name: plan, file: artifacts/plan.md}]
  - id: implement
    role: implementer
    tools: coding
    depends_on: [plan]
    consumes: [plan]
    prompt: "Implement the plan at {{output.plan.path}} for {{inputs.goal}} so that the acceptance spec at {{inputs.anchor}} passes; summarize the change."
    produces: [{name: change, file: artifacts/change.md}]
  - id: check-1
    run: 'printf ok'
    depends_on: [implement]
  - id: check-2
    run: 'test -f hello.txt'
    depends_on: [check-1]
  - id: verdict
    role: reviewer
    tools: readonly
    depends_on: [check-2]
    consumes: [change]
    prompt: "Review {{output.change.path}} against the acceptance spec at {{inputs.anchor}} and emit a JSON verdict."
    output_format: {type: object, required: [verdict], properties: {verdict: {type: string}}}
    produces: [{name: verdict, file: artifacts/verdict.json}]
